{% extends "admin/change_list.html" %}
{% load i18n admin_urls static %}

{% block extrahead %}
    {{ block.super }}
    <style>
        .grid-manager-link {
            display: inline-block;
            background: #007cba;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            margin-left: 10px;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        
        .grid-manager-link:hover {
            background: #005a87;
            color: white;
            text-decoration: none;
        }
        
        .grid-manager-link i {
            margin-right: 5px;
        }
        
        .import-export-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #007cba;
        }
        
        .import-export-actions h3 {
            margin: 0;
            color: #495057;
            font-size: 16px;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            border: 1px solid;
            transition: all 0.3s;
        }
        
        .action-btn:hover {
            text-decoration: none;
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .btn-primary {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        
        .btn-primary:hover {
            background: #0056b3;
            border-color: #0056b3;
            color: white;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }
        
        .btn-success:hover {
            background: #1e7e34;
            border-color: #1e7e34;
            color: white;
        }
        
        .btn-info {
            background: #17a2b8;
            color: white;
            border-color: #17a2b8;
        }
        
        .btn-info:hover {
            background: #117a8b;
            border-color: #117a8b;
            color: white;
        }
        
        .btn-warning {
            background: #ffc107;
            color: #212529;
            border-color: #ffc107;
        }
        
        .btn-warning:hover {
            background: #d39e00;
            border-color: #d39e00;
            color: #212529;
        }
    </style>
{% endblock %}

{% block content_title %}
    <div class="import-export-actions">
        <div>
            <h3><i class="fas fa-tools"></i> Property Management Tools</h3>
            <div class="action-buttons">
                <a href="{% url 'admin:properties_property_grid_manager' %}" class="action-btn btn-primary">
                    <i class="fas fa-table"></i> Grid Manager
                </a>
                <a href="{% url 'admin:properties_property_import_iso16757' %}" class="action-btn btn-success">
                    <i class="fas fa-file-import"></i> Import ISO 16757
                </a>
                <a href="{% url 'admin:properties_property_import_csv' %}" class="action-btn btn-info">
                    <i class="fas fa-file-csv"></i> Import CSV
                </a>
                <a href="{% url 'admin:properties_property_export_csv' %}" class="action-btn btn-warning">
                    <i class="fas fa-file-export"></i> Export CSV
                </a>
            </div>
        </div>
    </div>
    {{ block.super }}
{% endblock %}
