<select id="id_unit_item" name="unit_item" style="width:100%"
        data-libraries="{{ library_slugs }}"
        data-mode="priority"
        data-selected="{{ initial_unit_guid|default:'' }}">
</select>

{# Select2 CSS/JS (CDN) - remove if already included globally in your base template #}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

{# Your widget init script (served from static) #}
<script src="{% static 'properties/js/select2_library_widget.js' %}"></script>
<script>
  initSelect2LibraryWidget('#id_unit_item', "{% url 'properties:library_items_autocomplete' %}");
</script>
